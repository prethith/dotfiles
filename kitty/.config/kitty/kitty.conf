# add theme
# include gruvbox_dark_hard.conf


# font settings
font_family         Lilex Nerd Font Mono
bold_font           auto
italic_font         auto
bold_italic_font    auto

font_size 18.0

# url style
url_style dashed

# mouse actions
select_by_word_characters @-./_~?&=%+#


# window settings
hide_window_decorations yes
window_padding_width 6

# background
background_opacity 0.95


# BEGIN_KITTY_THEME
# kanagawabones
include current-theme.conf
# END_KITTY_THEME
